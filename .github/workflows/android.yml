name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-wrapper-source.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/sync-upstream.mjs
      - run: test -z "$(git status --porcelain --untracked-files=all -- app/src/main/assets)"
      - run: node scripts/sync-upstream.mjs --check
      - run: node scripts/export-strings.mjs --check
      - run: ./gradlew :app:checkStudioSources :core:test :core:nationalTideDirectionSweep :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleBenchmark :benchmark:assembleBenchmark :app:lintDebug :app:assembleDebugAndroidTest
      - name: Verify Premium links are disabled in shipping variants
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree
          android = "{http://schemas.android.com/apk/res/android}"
          for variant in ("release", "benchmark"):
              manifest, = (Path("app/build/intermediates/merged_manifest") / variant).glob("*/AndroidManifest.xml")
              activities = ElementTree.parse(manifest).findall("./application/activity")
              premium, = [activity for activity in activities if activity.get(android + "name", "").endswith(".PremiumLinkActivity")]
              assert premium.get(android + "enabled") == "false", f"Premium link enabled in {variant}"
          PYTHON
      - run: python3 scripts/check-apk.py app/build/outputs/apk/benchmark/app-benchmark.apk
      - run: python3 scripts/check-apk.py app/build/outputs/apk/debug/app-debug.apk
      - run: python3 scripts/check-apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports
            core/build/reports
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ['26', '37.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-upstream.mjs
      - run: test -z "$(git status --porcelain --untracked-files=all -- app/src/main/assets)"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          script: |
            # API 26 delivers the emulator's own GPS position past a test provider, so put it at the position
            # LocationRepositoryTest's providers report (its `here`).
            adb emu geo fix -140.0 30.0
            ./gradlew :app:connectedDebugAndroidTest
            if [ "${{ matrix.api }}" = "37.0" ]; then cp -R app/build/reports/androidTests app/build/reports/androidTests-enabled && cp -R app/build/outputs/androidTest-results app/build/outputs/androidTest-results-enabled && ./gradlew -PpremiumEnabled=false :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.openwaters.slackwater.android.premium.PremiumLinkTest,io.openwaters.slackwater.android.map.FreeDayControlTest,io.openwaters.slackwater.android.calendars.CalendarSettingsTest,io.openwaters.slackwater.android.sharing.StationScheduleTest; fi
      - name: Name the failed device tests
        # Cancelled covers a run that hangs until the job's timeout.
        if: failure() || cancelled()
        run: python3 scripts/report-device-failures.py "$GITHUB_STEP_SUMMARY" app/build/outputs/androidTest-results*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-${{ matrix.api }}
          # The XML results and every test's logcat sit beside the HTML reports.
          path: |
            app/build/reports/androidTests*
            app/build/outputs/androidTest-results*
