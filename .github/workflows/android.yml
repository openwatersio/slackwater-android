name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-wrapper-source.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/sync-upstream.mjs
      - run: test -z "$(git status --porcelain --untracked-files=all -- app/src/main/assets)"
      - run: node scripts/sync-upstream.mjs --check
      - run: ./gradlew :app:checkStudioSources :core:test :app:assembleDebug :app:assembleRelease :app:lintDebug :app:assembleDebugAndroidTest
      - run: python3 scripts/check-apk.py app/build/outputs/apk/debug/app-debug.apk
      - run: python3 scripts/check-apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports
            core/build/reports
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ['26', '37.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-upstream.mjs
      - run: test -z "$(git status --porcelain --untracked-files=all -- app/src/main/assets)"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-${{ matrix.api }}
          path: app/build/reports/androidTests
