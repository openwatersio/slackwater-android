[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose = "2026.09.00"
activity = "1.11.0"
junit = "4.13.2"
[plugins]
macrobenchmark-target = { id = "com.android.test", version.ref = "agp" }
android = { id = "com.android.application", version.ref = "agp" }
