compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
[libraries]
macrobenchmark = { module = "androidx.benchmark:benchmark-macro-junit4", version = "1.4.1" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.3.0" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
